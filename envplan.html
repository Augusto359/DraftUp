<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DraftUp</title>
    <link rel="stylesheet" href="css/envplan.css">
    <style>
         body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #333333;
    }
    </style>
</head>

<body>
    <div id="header">
        <header>
            <h1>DraftUp</h1>
            <nav>
                <a href="index.html" id="infos">Início</a>
                <a href="#" id="infos">Sobre</a>
                <a href="#" id="infos">Como funciona</a>
                <a href="#" id="infos">Contato</a>
            </nav>
        </header>
        
        <hr>
        <div id="area-upload">
            <p>Arraste sua planta aqui!</p>
        </div>

        <img id="preview-image" src="" alt="Sua planta" style="display: none;" />
    </div>

    <script>
        const areaUpload = document.getElementById('area-upload');

        areaUpload.addEventListener('dragover', (e) => {
            e.preventDefault(); 
            areaUpload.style.borderColor = '#a855f7'; 
            areaUpload.style.backgroundColor = '#1e1b4b'; 
        });

        areaUpload.addEventListener('dragleave', (e) => {
            e.preventDefault();
            areaUpload.style.borderColor = '#475569'; 
            areaUpload.style.backgroundColor = '#1e293b'; 
        });

        areaUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            areaUpload.style.borderColor = '#475569';
            areaUpload.style.backgroundColor = '#1e293b';
            
            const arquivos = e.dataTransfer.files;

            if (arquivos.length > 0) {
                console.log('arquivo detectado:', arquivos[0].name);
                alert('Arquivo detectado com sucesso: ' + arquivos[0].name);
            }
        });
    </script>
</body>
</html>
