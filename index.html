<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DraftUp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head> 

<body>
    <div id="header">
        
        <header>
            <h1 style="text-align: center; color: black;">DraftUp ------------ ai bixuda -------- Inicio -------- Sobre -------- Como funciona -------- Contato</h1>
        </header>
        
        <sub>iai bixuda</sub>
        
        <div id="area-upload" style="padding: 40px; text-align: center">
            <p>Arraste seu arquivo aqui bixuda</p>
        </div>

        <img
            id="preview-image"
            src=""
            alt="Sua planta"
            style="max-width: 100%; max-height: 200px; display: none; margin-top: 20px" />
    </div>

    <script>
        const areaUpload = document.getElementById('area-upload');

        areaUpload.addEventListener('dragover', (e) => {
            e.preventDefault(); 
            areaUpload.style.borderColor = '#a855f7'; 
        });

        areaUpload.addEventListener('dragleave', (e) => {
            e.preventDefault();
            areaUpload.style.borderColor = '#475569'; 
        });

        areaUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            areaUpload.style.borderColor = '#475569';
            
            const arquivos = e.dataTransfer.files;

            if (arquivos.length > 0) {
                console.log('arquivo detectado:', arquivos[0].name);
                alert('Arquivo detectado com sucesso: ' + arquivos[0].name);
            }
        });
    </script>
</body>
</html>
